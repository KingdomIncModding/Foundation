name: Complete XML documentation pass
on:
  push:
    branches:
      - docs/xml-api-comments-20261109
    paths:
      - Tools/document_public_api.py
      - .github/workflows/document-public-api.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/xml-api-comments-20261109
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Document public C# declarations
        run: python Tools/document_public_api.py .
      - name: Commit generated XML documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.cs'
          if ! git diff --cached --quiet; then
            git commit -m "docs: apply XML summaries across public C# declarations"
            git push
          fi
